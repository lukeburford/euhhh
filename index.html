<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>euhhh</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; }

  #caption {
    position: fixed; left: 50%; top: 50%;
    background: none; border: 0; padding: 0; cursor: pointer; color: #fff;
    font: clamp(2.5rem, 10vw, 7rem)/1 Impact, "Arial Black", sans-serif;
    -webkit-text-stroke: 3px #000; paint-order: stroke fill;
    transform: translate(-50%, -50%);
    animation: zoom 1.2s ease-in-out infinite alternate;
  }
  #caption:focus-visible { outline: 4px solid #fff; outline-offset: 8px; }
  @keyframes zoom {
    from { transform: translate(-50%, -50%) scale(.85); }
    to   { transform: translate(-50%, -50%) scale(1.15); }
  }
  @media (prefers-reduced-motion: reduce) { #caption { animation: none; } }
</style>
</head>
<body>
<canvas id="c"></canvas>
<button id="caption" aria-label="Turn sound on">euhhh</button>

<script>
// ---- Settings -------------------------------------------------------------
const CONFIG = {
  src: 'euhhh.mp4',
  tilesAcross: 4
};
// --------------------------------------------------------------------------

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const caption = document.getElementById('caption');

const video = document.createElement('video');
video.src = CONFIG.src;
video.loop = true;
video.muted = true;        // muted autoplay is allowed, so the tiles start straight away
video.playsInline = true;
video.autoplay = true;
video.play().catch(() => {});

function resize() {
  const dpr = window.devicePixelRatio || 1;
  canvas.width = Math.round(innerWidth * dpr);
  canvas.height = Math.round(innerHeight * dpr);
}
addEventListener('resize', resize);
resize();

(function draw() {
  if (video.videoWidth) {
    const tileW = canvas.width / CONFIG.tilesAcross;
    const tileH = tileW * (video.videoHeight / video.videoWidth);
    for (let y = 0; y < canvas.height; y += tileH) {
      for (let x = 0; x < canvas.width; x += tileW) {
        ctx.drawImage(video, x, y, tileW, tileH);
      }
    }
  }
  requestAnimationFrame(draw);
})();

// Clicking euhhh (or anywhere) turns the sound on and restarts from the top
function soundOn() {
  if (!video.muted) return;
  video.muted = false;
  video.currentTime = 0;
  video.play();
  caption.setAttribute('aria-label', 'Sound on');
}
document.addEventListener('click', soundOn);
document.addEventListener('keydown', soundOn);
</script>
</body>
</html>
